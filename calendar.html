<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calendar</title>
  <link rel="stylesheet" href="stylesCalendar.css">
</head>
<body>
  <div class="decors">
    <div class="decor decor_1"></div>
    <div class="decor decor_2"></div>
  </div>

  <div class="calendar">
    <div class="calendar_header">
      <div class="calendar_month" id="month-year"></div>
      <div class="calendar_btns">
        <button type="button" class="calendar_btn left" id="prev-btn">
          <img src="images/arrow-left.svg" alt="Иконка">
        </button>
        <button type="button" class="calendar_btn" id="next-btn">
          <img src="images/arrow-right.svg" alt="Иконка">
        </button>

      </div>
    </div>

    <div class="calendar_body">
      <div class="calendar_day-names">

      </div>
      <div class="calendar_days" id="calendar-days"></div>
    </div>
  </div>
  <script src="script2.js"></script>
</body>
</html>
